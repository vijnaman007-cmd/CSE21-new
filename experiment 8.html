<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile card</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .h2{
            text-align: center;
            font-size: 30px;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .card{
            background-color: white;
            width: 220px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);;
        }
        .avatar{
            border-radius: 50%;
            background-color: blue;
            color: white;
            height: 75px;
            width: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .name{
            font-weight: bold;
            margin-top: 5px;
        }
        .detail{
            color: gray;
            margin: 1px;
        }
    </style>
</head>
<body>
    <div class="h2">Student Profile Card</div>
    <div class="container">
        <div class="card">
             <div class ="avatar">JK</div>
        <div class="name">Jeet Kumar</div>
        <div class="detail">B.Tech-CSE</div>
        <div class="detail">Roll No:21CS1007</div>
        <div class="detail">1st Year</div>
        </div>
        <div class="card">
             
        <div class ="avatar">AR</div>
        <div class="name">Asha Rani</div>
        <div class="detail">B.Tech-IT</div>
        <div class="detail">Roll No:21IT1012</div>
        <div class="detail">1st Year</div>
        </div>
        <div class="card">
        
        <div class ="avatar">RK</div>
        <div class="name">Rohit Kumar</div>
        <div class="detail">B.Tech-ECE</div>
        <div class="detail">Roll No:21EC1009</div>
        <div class="detail">1st Year</div>
        </div>

    </div>
<br><br><br>
<hr>
    <!-- Student Info at the end -->
    <p><b>Name:</b> Naman Vij</p>
    <p><b>Admission Number:</b> 2025B01010427</p>
</body>
</html>
